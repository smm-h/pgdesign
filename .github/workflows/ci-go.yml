name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Per-SHA group: re-runs of the same commit dedupe, but a new commit never
# cancels an earlier commit's in-flight run (release CI conclusions stay intact).
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U test" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PGDESIGN_DB: postgres://test:test@localhost:5432/postgres?sslmode=disable
      PGDESIGN_REQUIRE_DB: '1'
      # Make the DB-free compile checks (internal/test/codegen_compile_test.go)
      # hard-fail if any of the six language toolchains is missing, so CI can
      # never silently skip a language. Every toolchain below must be provisioned.
      PGDESIGN_REQUIRE_COMPILE_TOOLCHAINS: '1'
    steps:
      - uses: actions/checkout@v6
      # go.mod: go 1.26.3
      - name: Set up postgres service container
        run: |
          docker exec ${{ job.services.postgres.id }} bash -c "apt-get update && apt-get install -y --no-install-recommends postgresql-17-partman && rm -rf /var/lib/apt/lists/*"
          PGPASSWORD=test psql -h localhost -U test -d postgres -c "SELECT name, default_version FROM pg_available_extensions WHERE name = 'pg_partman';"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # --- Compile-check toolchains (4.0) + conformance-suite runtimes ---
      # Java: javac for the Java compile check; also unblocks conformance if
      # gradle is present (it is not provisioned here, so those stay skipped).
      - name: Set up Java (javac)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Kotlin: kotlinc for the Kotlin compile check (needs a JDK, set up above).
      - name: Set up Kotlin (kotlinc)
        run: |
          KOTLIN_VERSION=2.0.20
          curl -sSL "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip" -o /tmp/kotlin.zip
          unzip -q /tmp/kotlin.zip -d "$HOME/kotlin"
          echo "$HOME/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      # Zig: zig build-obj for the Zig compile check.
      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      # Node + TypeScript: tsc for the TS compile check; node/npx also unblock
      # the TypeScript DB conformance test (npm install + npx tsx).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript (tsc)
        run: npm install -g typescript@5
      # Python: mypy for the Python compile check; psycopg + pytest also unblock
      # the Python DB conformance test.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python toolchain (mypy, psycopg, pytest)
        run: pip install mypy 'psycopg[binary]' pytest

      - run: go vet ./...
      - run: go test ./... -race -short -timeout=10m
