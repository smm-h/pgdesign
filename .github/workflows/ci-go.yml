name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Per-SHA group: re-runs of the same commit dedupe, but a new commit never
# cancels an earlier commit's in-flight run (release CI conclusions stay intact).
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # PGDESIGN_DB is deliberately NOT set. Each database-backed test binary
      # boots its own ephemeral cluster in TestMain (testdb.RunWithCluster) from
      # the PostgreSQL packages installed on the runner host below, and exports
      # the DSN itself. A DSN handed in here would point the suite at a server
      # nobody asked it to touch -- which is the pattern this lane replaced.
      #
      # These two turn a failed provisioning step into a failed run instead of a
      # green run full of skips.
      PGDESIGN_REQUIRE_DB: '1'
      PGDESIGN_REQUIRE_PARTMAN: '1'
      # Make the DB-free compile checks (internal/test/codegen_compile_test.go)
      # hard-fail if any of the six language toolchains is missing, so CI can
      # never silently skip a language. Every toolchain below must be provisioned.
      PGDESIGN_REQUIRE_COMPILE_TOOLCHAINS: '1'
    steps:
      - uses: actions/checkout@v6
      # go.mod: go 1.26.3
      # --- PostgreSQL on the runner host (no service container) ---
      # The suite boots its own throwaway cluster on a unix socket, so what CI
      # has to provide is the server BINARIES and the extension library, not a
      # running server: an ephemeral cluster inherits whatever extensions are
      # installed alongside the initdb that created it. pg_partman and pgvector
      # are both schema features pgdesign generates DDL for, so both must be
      # present or the tests that exercise them would quietly skip.
      - name: Install PostgreSQL 18 with pg_partman and pgvector
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            postgresql-18 postgresql-18-partman postgresql-18-pgvector
          # initdb and pg_ctl live in the version directory, not on PATH. Putting
          # PG 18's bin first makes the cluster launcher pick that version
          # outright rather than falling to the runner's preinstalled older one.
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - name: Verify the extension library the cluster will inherit
        run: |
          ls /usr/share/postgresql/18/extension/pg_partman.control
          ls /usr/share/postgresql/18/extension/vector.control
          initdb --version
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # --- Compile-check toolchains (4.0) + conformance-suite runtimes ---
      # Java: javac for the Java compile check; also unblocks conformance if
      # gradle is present (it is not provisioned here, so those stay skipped).
      - name: Set up Java (javac)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Kotlin: kotlinc for the Kotlin compile check (needs a JDK, set up above).
      - name: Set up Kotlin (kotlinc)
        run: |
          KOTLIN_VERSION=2.0.20
          curl -sSL "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip" -o /tmp/kotlin.zip
          unzip -q /tmp/kotlin.zip -d "$HOME/kotlin"
          echo "$HOME/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      # Zig: zig build-obj for the Zig compile check.
      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      # Node + TypeScript: tsc for the TS compile check; node/npx also unblock
      # the TypeScript DB conformance test (npm install + npx tsx).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript (tsc)
        run: npm install -g typescript@5
      # Python: mypy for the Python compile check; psycopg + pytest also unblock
      # the Python DB conformance test.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python toolchain (mypy, psycopg, pytest)
        run: pip install mypy 'psycopg[binary]' pytest

      - run: go vet ./...
      - run: go test ./... -race -short -timeout=10m
