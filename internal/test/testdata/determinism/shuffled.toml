format_version = 1
# Same schema as canonical.toml, but the declaration order of the map-sourced
# collections (checks, indexes, uniques, policies, fks) is permuted. Column order
# and enum value order are IDENTICAL to canonical.toml (those are semantic and
# never reordered). Canonicalize must make this produce byte-identical output to
# canonical.toml.

[meta]
version = 16
schema = "shop"
extensions = ["pgcrypto"]

[types.user_role]
kind = "enum"
values = ["admin", "customer", "guest"]

[types.order_status]
kind = "enum"
values = ["pending", "shipped", "delivered"]

# -- Orders declared first this time (table order is topological, not textual) --

[tables.orders]
comment = "Customer orders."
enable_rls = true

[tables.orders.columns.id]
type = "id"

[tables.orders.columns.user_id]
type = "ref"

[tables.orders.columns.product_id]
type = "ref"

[tables.orders.columns.status]
type = "order_status"

[tables.orders.columns.total]
type = "money"

[tables.orders.columns.created_at]
type = "timestamp"

# fks permuted: product before user
[tables.orders.fks.fk_orders_product]
columns = ["product_id"]
ref_table = "products"
ref_columns = ["id"]
on_delete = "RESTRICT"

[tables.orders.fks.fk_orders_user]
columns = ["user_id"]
ref_table = "users"
ref_columns = ["id"]
on_delete = "CASCADE"

# policies permuted: insert before select
[tables.orders.policies.orders_insert]
for = "INSERT"
to = "app_user"
with_check = "user_id = current_setting('app.user_id')::uuid"

[tables.orders.policies.orders_select]
for = "SELECT"
to = "app_user"
using = "user_id = current_setting('app.user_id')::uuid"

# indexes permuted: created before status
[tables.orders.indexes.idx_orders_created]
columns = ["created_at"]

[tables.orders.indexes.idx_orders_status]
columns = ["status"]

# uniques permuted: user_created before user_product
[tables.orders.unique.uq_orders_user_created]
columns = ["user_id", "created_at"]

[tables.orders.unique.uq_orders_user_product]
columns = ["user_id", "product_id"]

# checks permuted: distinct before total
[tables.orders.checks.ck_orders_user_product_distinct]
expr = "user_id <> product_id"

[tables.orders.checks.ck_orders_total_positive]
expr = "total >= 0"

# -- Products --

[tables.products]
comment = "Catalog products."

[tables.products.columns.id]
type = "id"

[tables.products.columns.name]
type = "short_text"

[tables.products.columns.price]
type = "money"

# -- Users --

[tables.users]
comment = "Registered users."
enable_rls = true

[tables.users.columns.id]
type = "id"

[tables.users.columns.email]
type = "short_text"

[tables.users.columns.username]
type = "short_text"

[tables.users.columns.role]
type = "user_role"

# indexes permuted: email before role
[tables.users.indexes.idx_users_email]
columns = ["email"]

[tables.users.indexes.idx_users_role]
columns = ["role"]

# policies permuted: update before select
[tables.users.policies.users_update]
for = "UPDATE"
to = "app_user"
using = "id = current_setting('app.user_id')::uuid"

[tables.users.policies.users_select]
for = "SELECT"
to = "app_user"
using = "id = current_setting('app.user_id')::uuid"

# checks permuted: username before email
[tables.users.checks.ck_users_username_nonempty]
expr = "username <> ''"

[tables.users.checks.ck_users_email_nonempty]
expr = "email <> ''"

# uniques permuted: username before email
[tables.users.unique.uq_users_username]
columns = ["username"]

[tables.users.unique.uq_users_email]
columns = ["email"]

# -- Materialized view; indexes permuted: spent before user --

[materialized_views.order_totals]
query = "SELECT user_id, count(*) AS order_count, sum(total) AS total_spent FROM shop.orders GROUP BY user_id"
comment = "Per-user order rollup."

[materialized_views.order_totals.indexes.idx_order_totals_spent]
columns = ["total_spent"]

[materialized_views.order_totals.indexes.idx_order_totals_user]
columns = ["user_id"]
unique = true

# -- Views declared in reverse; dependency order comes from depends_on --

[views.active_orders_by_user]
query = "SELECT user_id, count(*) AS n FROM shop.active_orders GROUP BY user_id"
comment = "Active order counts per user."
depends_on = ["active_orders"]

[views.active_orders]
query = "SELECT id, user_id, total FROM shop.orders WHERE status <> 'delivered'"
comment = "Orders not yet delivered."
depends_on = ["orders"]
