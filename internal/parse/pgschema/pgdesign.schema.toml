# pgdesign schema-document shape, in strictspec surface syntax.
#
# This is the DOCUMENT-SHAPE authority for pgdesign schema TOMLs: it owns
# well-formedness (record tree), closed records (unknown keys are a hard error),
# base-type conformance (string/integer/boolean/number/array), required fields,
# and the three custom-scalar lexeme refinements (identifier/pgtype/
# sql-expression, registered in strictspec.toml). It does NOT own semantics:
# type existence, FK/enum-value/reference resolution, SQL grammaticality, normal
# form, and cross-field mutual-exclusivity stay in pgdesign's model/validate
# layer (one authority per property).
#
# Complete against internal/parse/parse.go's accepted shape (the knownKeys sets
# and the six node coercers) and the 28 in-repo schema TOMLs. Every schema
# document must now carry a top-level `format_version = 1` (the strictspec
# version gate) — added to the corpus by scripts/stamp_format_version.sh.

name = "pgdesign-schema"
meta_version = 1
format_version = 1
document_syntax = "toml"
role = "schema"
root = "Schema"
targets = ["go"]
description = "A pgdesign PostgreSQL schema document: meta, types, tables, views, materialized views, sequences, functions, and groups."

# --- root -------------------------------------------------------------------

[types.Schema]
type = "record"

[types.Schema.fields.meta]
type = "Meta"
required = false

[types.Schema.fields.types]
type = "map"
required = false
key_pattern = "^[A-Za-z_][A-Za-z0-9_]*$"
order = "incidental"
[types.Schema.fields.types.value]
type = "TypeDef"

[types.Schema.fields.tables]
type = "map"
required = false
key_pattern = "^[A-Za-z_][A-Za-z0-9_]*$"
order = "incidental"
[types.Schema.fields.tables.value]
type = "Table"

[types.Schema.fields.views]
type = "map"
required = false
key_pattern = "^[A-Za-z_][A-Za-z0-9_]*$"
order = "incidental"
[types.Schema.fields.views.value]
type = "View"

[types.Schema.fields.materialized_views]
type = "map"
required = false
key_pattern = "^[A-Za-z_][A-Za-z0-9_]*$"
order = "incidental"
[types.Schema.fields.materialized_views.value]
type = "MatView"

[types.Schema.fields.sequences]
type = "map"
required = false
key_pattern = "^[A-Za-z_][A-Za-z0-9_]*$"
order = "incidental"
[types.Schema.fields.sequences.value]
type = "Sequence"

[types.Schema.fields.functions]
type = "map"
required = false
key_pattern = "^[A-Za-z_][A-Za-z0-9_]*$"
order = "incidental"
[types.Schema.fields.functions.value]
type = "Function"

# [groups]: group name -> list of table names.
[types.Schema.fields.groups]
type = "map"
required = false
key_pattern = "^[A-Za-z_][A-Za-z0-9_]*$"
order = "incidental"
[types.Schema.fields.groups.value]
type = "array"
[types.Schema.fields.groups.value.item]
type = "identifier"

# --- meta -------------------------------------------------------------------

[types.Meta]
type = "record"
[types.Meta.fields.version]
type = "integer"
required = false
description = "PostgreSQL major version target (RawMeta.Version)."
[types.Meta.fields.schema]
