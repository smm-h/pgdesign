# opclass / collation accept EITHER a single string (applied to all columns) OR
# an inline table of per-column strings. node-kind-union dispatches by node kind
# (string vs record/inline-table).
[types.StringOrStringMap]
type = "node-kind-union"
description = "A single string, or an inline table mapping column name -> string."
[types.StringOrStringMap.arms.string]
type = "string"
[types.StringOrStringMap.arms.map]
type = "map"
key_pattern = "^[A-Za-z_][A-Za-z0-9_]*$"
order = "incidental"
[types.StringOrStringMap.arms.map.value]
type = "string"

