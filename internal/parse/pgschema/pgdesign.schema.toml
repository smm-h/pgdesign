required = false
[types.TypeDef.fields.base_type]
type = "pgtype"
required = false
[types.TypeDef.fields.values]
type = "array"
required = false
[types.TypeDef.fields.values.item]
type = "string"
[types.TypeDef.fields.not_null]
type = "boolean"
required = false
[types.TypeDef.fields.default]
type = "string"
required = false
[types.TypeDef.fields.default_expr]
type = "sql-expression"
required = false
[types.TypeDef.fields.check]
type = "sql-expression"
required = false
[types.TypeDef.fields.unique]
type = "boolean"
required = false
[types.TypeDef.fields.array]
type = "boolean"
required = false
[types.TypeDef.fields.comment]
type = "string"
required = false
[types.TypeDef.fields.initial]
type = "identifier"
required = false
[types.TypeDef.fields.enforce]
type = "boolean"
required = false
# [types.X.fields]: composite field name -> PG type.
[types.TypeDef.fields.fields]
type = "map"
required = false
key_pattern = "^[A-Za-z_][A-Za-z0-9_]*$"
order = "semantic"
[types.TypeDef.fields.fields.value]
type = "pgtype"
# [types.X.states.Y]: state machine states.
[types.TypeDef.fields.states]
type = "map"
required = false
key_pattern = "^[A-Za-z_][A-Za-z0-9_]*$"
order = "semantic"
[types.TypeDef.fields.states.value]
type = "SMState"
# [[types.X.transitions]]: state machine transitions.
[types.TypeDef.fields.transitions]
type = "array"
required = false
[types.TypeDef.fields.transitions.item]
type = "SMTransition"

[types.SMState]
type = "record"
[types.SMState.fields.terminal]
type = "boolean"
required = false
[types.SMState.fields.comment]
type = "string"
required = false

[types.SMTransition]
type = "record"
[types.SMTransition.fields.name]
type = "identifier"
required = true
[types.SMTransition.fields.from]
type = "array"
required = true
min_len = 1
[types.SMTransition.fields.from.item]
type = "identifier"
[types.SMTransition.fields.to]
type = "identifier"
required = true
[types.SMTransition.fields.requires]
type = "map"
required = false
key_pattern = "^[A-Za-z_][A-Za-z0-9_]*$"
order = "incidental"
[types.SMTransition.fields.requires.value]
type = "string"
[types.SMTransition.fields.comment]
type = "string"
required = false

